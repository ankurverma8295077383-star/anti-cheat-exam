<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Teacher Admin Dashboard - Exam Results</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #007bff; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .violation-badge { background: #ff4d4d; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .success-badge { background: #28a745; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        
        /* Action Buttons CSS */
        .btn-pdf { background: #17a2b8; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;}
        .btn-pdf:hover { background: #138496; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; margin-left: 5px; }
        .btn-delete:hover { background: #c82333; }
        
        /* Checkbox CSS */
        .select-cb { transform: scale(1.5); cursor: pointer; }
    </style>

    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

    <h1>📋 Exam Submissions & Violation Log</h1>
    
    <div style="margin-bottom: 20px;">
        <button onclick="loadData()" style="padding: 10px 15px; cursor: pointer;">🔄 Refresh Data</button>
        <button onclick="clearHistory()" style="padding: 10px 15px; cursor: pointer; background-color: #dc3545; color: white; border: none; margin-left: 10px; border-radius: 4px;">🗑️ Clear All History</button>
        <button onclick="downloadMasterPDF()" style="padding: 10px 15px; cursor: pointer; background-color: #28a745; color: white; border: none; margin-left: 10px; border-radius: 4px;">📥 Download Selected as Master PDF</button>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 40px; text-align: center;">
                    <input type="checkbox" id="selectAll" class="select-cb" onclick="toggleSelectAll()">
                </th>
                <th>Student ID / Name</th>
                <th>Submitted Time</th>
                <th>Answers (Preview)</th>
                <th>Total Violations</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="submissionTable">
            <tr><td colspan="6">Loading data...</td></tr>
        </tbody>
    </table>

<script>
    // ===============================================
    // 🛑 MASTER ANSWER KEY & QUESTION PAPER DATA
    // ===============================================
    const masterAnswerKey = {
            "q1": { question: "1. What does the acronym GIS stand for?", correct: "Geographical Information System" },
            "q2": { question: "2. In GIS terminology, 'spatial information' refers to data that:", correct: "Has a specific geographic location" },
            "q3": { question: "3. Which of the following is considered the first operational computerized GIS?", correct: "CGIS (Canada Geographic Information System)" },
            "q4": { question: "4. Which of these is NOT one of the five core components of a GIS?", correct: "Internet" },
            "q5": { question: "5. What is the primary objective of a Geographic Information System?", correct: "To capture, store, analyze, and manage spatial data" },
            "q6": { question: "6. Which hardware device is traditionally used to manually input physical map data into a GIS?", correct: "Digitizing Tablet" },
            "q7": { question: "7. In a computer system used for GIS, what handles the execution of spatial analysis calculations?", correct: "CPU (Central Processing Unit)" },
            "q8": { question: "8. Non-spatial data that describes the characteristics of a geographic feature is called:", correct: "Attribute data" },
            "q9": { question: "9. The two primary spatial data formats used in GIS are:", correct: "Raster and Vector" },
            "q10": { question: "10. Who is widely recognized as the 'Father of GIS'?", correct: "Roger Tomlinson" },
            "q11": { question: "11. A GIS 'Layer' (or theme) is best described as:", correct: "A single geographic dataset representing a specific feature type (e.g., roads)" },
            "q12": { question: "12. The Raster Data Model represents spatial information using:", correct: "A continuous grid of cells or pixels" },
            "q13": { question: "13. Which data model is best suited for representing discrete, clearly bounded features like property parcels?", correct: "Vector Data Model" },
            "q14": { question: "14. What does DBMS stand for?", correct: "Database Management System" },
            "q15": { question: "15. The Relational Data Model organizes data into:", correct: "Tables that can be linked using common key fields" },
            "q16": { question: "16. Which database model stores data in a rigid, tree-like structure with 'one-to-many' relationships?", correct: "Hierarchy Data Model" },
            "q17": { question: "17. An Object-Oriented Data Model defines real-world entities as:", correct: "Objects with attributes and behaviors (methods)" },
            "q18": { question: "18. In a Vector Data Model, a feature with length but no area is represented as a:", correct: "Line (or Polyline)" },
            "q19": { question: "19. The primary objective of a database in GIS is to:", correct: "Reduce data redundancy and manage information efficiently" },
            "q20": { question: "20. Which of the following is a fundamental GIS Data Type used for storing names or categories in an attribute table?", correct: "String / Text" },
            "q21": { question: "21. Which data input method involves converting an analog paper map into a digital raster image?", correct: "Scanning" },
            "q22": { question: "22. The process of manually tracing features on a computer screen to create vector data is called:", correct: "Heads-up Digitization" },
            "q23": { question: "23. Collecting highly accurate spatial data directly from the field using equipment like Total Stations and GPS is known as:", correct: "Surveying" },
            "q24": { question: "24. Because the Earth is slightly flattened at the poles and bulges at the equator, its mathematical shape is best described as an:", correct: "Oblate Spheroid / Ellipsoid" },
            "q25": { question: "25. The highly irregular, equipotential surface of the Earth that represents global mean sea level shaped by gravity is the:", correct: "Geoid" },
            "q26": { question: "26. In GIS, what provides a standard reference frame for specifying locations on the Earth's surface (e.g., WGS 84)?", correct: "Datum" },
            "q27": { question: "27. Geographic Coordinate Systems (GCS) define locations using:", correct: "Latitude and Longitude in degrees" },
            "q28": { question: "28. Projected Coordinate Systems transform the 3D surface of the Earth onto a:", correct: "2D Flat Surface" },
            "q29": { question: "29. The main objective of a Map Projection is to:", correct: "Flatten the curved surface of the earth for mapping" },
            "q30": { question: "30. A map projection that preserves the true shape of local features is classified as:", correct: "Conformal" },
            "q31": { question: "31. Which projection classification ensures that the area of features is represented accurately across the map?", correct: "Equal-Area" },
            "q32": { question: "32. The process of assigning real-world coordinates to a scanned map or unreferenced image is called:", correct: "Data Registration / Georeferencing" },
            "q33": { question: "33. 'Attributes Generation' in GIS refers to:", correct: "Creating tabular data that describes the non-spatial properties of features" },
            "q34": { question: "34. During vector data editing, a line that fails to connect to another line by stopping just short is known as an:", correct: "Undershoot" },
            "q35": { question: "35. When digitizing adjacent properties, slightly overlapping boundaries often create small, unintended polygons called:", correct: "Slivers" },
            "q36": { question: "36. What is the main purpose of 'Cleaning' vector data?", correct: "To identify and fix geometric errors like dangles and slivers" },
            "q37": { question: "37. In GIS, what defines the spatial relationships between features, such as adjacency, connectivity, and containment?", correct: "Topology" },
            "q38": { question: "38. A topological rule stating 'Polygons must not overlap' is crucial for ensuring the accuracy of:", correct: "Land parcel boundaries" },
            "q39": { question: "39. Positional accuracy in GIS refers to:", correct: "How closely a mapped feature matches its true location on Earth" },
            "q40": { question: "40. Linking spatial data (like a state boundary) with non-spatial data (like population stats) requires:", correct: "A common identifier (Key Field) in both tables" },
            "q41": { question: "41. Fill in the blank: True or False questions test absolute facts. In a GIS, Map Projections ALWAYS introduce some form of ________.", correct: "Distortion" },
            "q42": { question: "42. True or False: Converting from Vector to Raster format can result in a loss of precise geometric detail.", correct: "True" },
            "q43": { question: "43. Which projection surface wraps a cylinder around the Earth's model?", correct: "Cylindrical Projection" },
            "q44": { question: "44. A projection surface placed flat against the Earth's pole is an example of an:", correct: "Azimuthal / Planar Projection" },
            "q45": { question: "45. What kind of error occurs if a non-spatial attribute is recorded incorrectly (e.g., spelling 'Rohtak' as 'Rohtuk')?", correct: "Attribute Error" },
            "q46": { question: "46. Which topological rule ensures a water distribution network functions continuously in GIS?", correct: "Connectivity (Must not have dangles)" },
            "q47": { question: "47. Fill in the blank: The point where two vector lines meet or intersect is technically called a ________.", correct: "Node" },
            "q48": { question: "48. The individual dots or squares that make up a Raster dataset are known as:", correct: "Cells or Pixels" },
            "q49": { question: "49. Which of the following is considered continuous spatial data?", correct: "Atmospheric Temperature" },
            "q50": { question: "50. A 'Shapefile' is a common industry standard format that utilizes which data model?", correct: "Vector" },
            "q51": { question: "51. Which database management system links external non-spatial files to spatial features seamlessly?", correct: "DBMS" },
            "q52": { question: "52. When editing vector data, snapping tools are used to:", correct: "Ensure nodes connect exactly without undershoots or overshoots" },
            "q53": { question: "53. True or False: Coordinate systems are categorized purely into two types: Geographic and Projected.", correct: "True" },
            "q54": { question: "54. An image captured by a satellite or drone requires what process before it aligns with vector layers?", correct: "Data Registration / Georeferencing" },
            "q55": { question: "55. Which of the following best defines a 'Spheroid' in GIS?", correct: "A mathematical model approximating the shape of the earth" },
            "q56": { question: "56. True or False: Object-Oriented Data Models bundle geometry and attributes together, allowing for complex behaviors like inheritance.", correct: "True" },
            "q57": { question: "57. Which data type is strictly used for storing numerical values that include decimals, like exact area measurements?", correct: "Float / Double" },
            "q58": { question: "58. If a GIS user is creating a boundary map and accidentally clicks past the joining line, the resulting error is called:", correct: "An Overshoot (Dangling Node)" },
            "q59": { question: "59. Map projections are broadly classified into three standard developable surfaces: Cylindrical, Azimuthal (Planar), and:", correct: "Conic" },
            "q60": { question: "60. In the historical development of GIS, earlier mapping methods were restricted because spatial and non-spatial data were:", correct: "Difficult to link dynamically for mathematical analysis" }
        };
    let globalStudentData = []; 

    function loadData() {
        fetch('/api/all-submissions')
            .then(res => res.json())
            .then(data => {
                globalStudentData = data; 
                const tbody = document.getElementById('submissionTable');
                tbody.innerHTML = '';
                document.getElementById('selectAll').checked = false;

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">अभी तक किसी छात्र ने एग्जाम नहीं दिया है।</td></tr>';
                    return;
                }

                data.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    
                    let rawJSON = item.answers ? JSON.stringify(item.answers) : 'No Answers';
                    const answersPreview = rawJSON.length > 80 ? rawJSON.substring(0, 80) + '...' : rawJSON;
                    
                    let violationDetails = '';
                    if (item.violations && item.violations.length > 0) {
                        violationDetails = item.violations.map(v => `${v.type} (${v.time})`).join('<br>');
                    }

                    const violationBadge = item.violations.length > 0 
                        ? `<span class="violation-badge">${item.violations.length} Violations</span><br><span style="font-size: 11px; color: #d9534f; display:block; margin-top:5px;">${violationDetails}</span>` 
                        : `<span class="success-badge">Clean Exam</span>`;

                    tr.innerHTML = `
                        <td style="text-align: center;">
                            <input type="checkbox" class="student-cb select-cb" value="${index}">
                        </td>
                        <td><strong>${item.studentName || 'Unknown'}</strong><br><small>${item.studentId || 'N/A'}</small></td>
                        <td>${new Date(item.submittedAt).toLocaleString()}</td>
                        <td><code>${answersPreview}</code></td>
                        <td>${violationBadge}</td>
                        <td style="display:flex; align-items:center;">
                            <button class="btn-pdf" onclick="downloadSinglePDF(${index})">📄 Get PDF</button>
                            <button class="btn-delete" onclick="deleteSingleRecord('${item._id}')">🗑️ Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error(err);
                alert('Data load करने में समस्या आई।');
            });
    }

    function toggleSelectAll() {
        const isChecked = document.getElementById('selectAll').checked;
        const checkboxes = document.querySelectorAll('.student-cb');
        checkboxes.forEach(cb => cb.checked = isChecked);
    }

    function deleteSingleRecord(recordId) {
        if (confirm("⚠️ क्या आप सच में इस छात्र का डेटा डिलीट करना चाहते हैं?")) {
            fetch(`/api/delete-submission/${recordId}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadData(); 
                } else {
                    alert("डेटा डिलीट करने में प्रॉब्लम आई।");
                }
            })
            .catch(err => {
                console.error("Delete error:", err);
                alert("Server error.");
            });
        }
    }

    function clearHistory() {
        if (confirm("⚠️ क्या आप सच में सारा पुराना डेटा डिलीट करना चाहते हैं? यह डेटा वापस नहीं मिलेगा!")) {
            fetch('/api/clear-submissions', { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("सारा पुराना डेटा डिलीट हो गया है! अब फ्रेश एग्जाम लिए जा सकते हैं।");
                    loadData(); 
                } else {
                    alert("डेटा डिलीट करने में प्रॉब्लम आई।");
                }
            })
            .catch(err => {
                console.error("Clear error:", err);
                alert("Server error.");
            });
        }
    }

    // ===============================================
    // PDF GENERATION SYSTEM (DYNAMIC AUTO-CHECKING)
    // ===============================================

    function formatAnswersForTable(answersObj) {
        if (!answersObj) answersObj = {}; 
        
        let formattedData = [];
        let score = 0;
        let totalQuestions = 0; 

        let allKeys = new Set([...Object.keys(answersObj), ...Object.keys(masterAnswerKey)]);
        
        let sortedKeys = Array.from(allKeys).sort((a, b) => {
            return (parseInt(a.match(/\d+/)) || 0) - (parseInt(b.match(/\d+/)) || 0);
        });

        for (let key of sortedKeys) {
            if (!key.startsWith('q')) continue;

            let studentAns = answersObj[key] ? answersObj[key] : "Not Attempted"; 
            let questionText = key.toUpperCase();
            let correctAns = "Manual Check";
            let status = "📝 Check";

            if (masterAnswerKey[key]) {
                questionText = masterAnswerKey[key].question;
                
                if (masterAnswerKey[key].correct) {
                    correctAns = masterAnswerKey[key].correct;
                    totalQuestions++; 
                    
                    if (studentAns === "Not Attempted") {
                        status = "⚠️ Skipped";
                    } else if (studentAns.trim() === correctAns.trim()) {
                        status = "✅ Correct";
                        score++;
                    } else {
                        status = "❌ Wrong";
                    }
                } else {
                    correctAns = "Theory Question";
                }
            } else {
                questionText = `Question ${key.replace('q', '')} (Missing in Admin Key)`;
                status = "⚠️ Update Admin Key";
            }
            
            formattedData.push([questionText, studentAns, correctAns, status]);
        }
        
        return { table: formattedData, score: score, total: totalQuestions };
    }

    function downloadSinglePDF(index) {
        const student = globalStudentData[index];
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(18);
        doc.text("Student Examination Report", 14, 20);
        
        const resultData = formatAnswersForTable(student.answers);

        doc.setFontSize(12);
        doc.text(`Name: ${student.studentName || 'Unknown'}`, 14, 30);
        doc.text(`Batch / ID: ${student.studentId || 'N/A'}`, 14, 38);
        doc.text(`Submission Time: ${new Date(student.submittedAt).toLocaleString()}`, 14, 46);
        doc.text(`Violations: ${student.violations ? student.violations.length : 0}`, 14, 54);
        
        doc.setTextColor(40, 167, 69);
        doc.text(`Score (MCQs): ${resultData.score} / ${resultData.total}`, 120, 30);
        doc.setTextColor(0, 0, 0);
        
        doc.autoTable({
            startY: 60,
            head: [['Question', 'Student Answer', 'Correct Answer', 'Result']],
            body: resultData.table,
            theme: 'grid',
            headStyles: { fillColor: [0, 123, 255] },
            columnStyles: { 
                0: { cellWidth: 70 }, 
                1: { cellWidth: 40 }, 
                2: { cellWidth: 40 }, 
                3: { cellWidth: 25 }  
            }
        });
        
        doc.save(`${student.studentName || 'Student'}_Exam_Report.pdf`);
    }

    function downloadMasterPDF() {
        const checkboxes = document.querySelectorAll('.student-cb:checked');
        if (checkboxes.length === 0) {
            return alert("मास्टर PDF बनाने के लिए कम से कम एक छात्र का चयन करें!");
        }

        const selectedStudents = Array.from(checkboxes).map(cb => globalStudentData[cb.value]);

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(22);
        doc.setTextColor(0, 123, 255);
        doc.text("Master Question Paper & Answer Key", 14, 20);
        
        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        doc.text(`Date Generated: ${new Date().toLocaleString()}`, 14, 30);
        
        let masterTableData = [];
        for (let key in masterAnswerKey) {
            masterTableData.push([
                key.toUpperCase(),
                masterAnswerKey[key].question,
                masterAnswerKey[key].correct || "Manual Check (Theory)"
            ]);
        }
        
        doc.autoTable({
            startY: 40,
            head: [['Q. No', 'Question', 'Correct Answer']],
            body: masterTableData,
            theme: 'grid',
            headStyles: { fillColor: [52, 58, 64] },
            columnStyles: { 
                0: { cellWidth: 20 },
                1: { cellWidth: 100 },
                2: { cellWidth: 60 }
            }
        });

        selectedStudents.forEach((student, i) => {
            doc.addPage(); 
            let currentY = 20;
            
            const resultData = formatAnswersForTable(student.answers);

            doc.setFontSize(16);
            doc.setTextColor(40, 167, 69); 
            doc.text(`Student: ${student.studentName || 'Unknown'} (Batch/ID: ${student.studentId || 'N/A'})`, 14, currentY);
            
            doc.setFontSize(11);
            doc.setTextColor(100, 100, 100);
            doc.text(`Submitted At: ${new Date(student.submittedAt).toLocaleString()}`, 14, currentY + 8);
            doc.text(`Violations Recorded: ${student.violations ? student.violations.length : 0}`, 14, currentY + 14);
            
            doc.setTextColor(0, 0, 0);
            doc.setFont(undefined, 'bold');
            doc.text(`MCQ Score: ${resultData.score} / ${resultData.total}`, 140, currentY + 14);
            doc.setFont(undefined, 'normal');
            
            doc.autoTable({
                startY: currentY + 20,
                head: [['Question', 'Student Answer', 'Correct Answer', 'Result']],
                body: resultData.table,
                theme: 'striped',
                headStyles: { fillColor: [52, 58, 64] },
                columnStyles: { 
                    0: { cellWidth: 70 },
                    1: { cellWidth: 40 },
                    2: { cellWidth: 40 },
                    3: { cellWidth: 25 }
                }
            });
        });
        
        doc.save("Master_Exam_Report_GIS.pdf");
    }

    loadData();
</script>

</body>
</html>
