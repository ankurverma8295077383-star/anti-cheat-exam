<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Teacher Admin Dashboard - Exam Results</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #007bff; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .violation-badge { background: #ff4d4d; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .success-badge { background: #28a745; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        
        /* Action Buttons CSS */
        .btn-pdf { background: #17a2b8; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;}
        .btn-pdf:hover { background: #138496; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; margin-left: 5px; }
        .btn-delete:hover { background: #c82333; }
    </style>

    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

    <h1>📋 Exam Submissions & Violation Log</h1>
    
    <div style="margin-bottom: 20px;">
        <button onclick="loadData()" style="padding: 10px 15px; cursor: pointer;">🔄 Refresh Data</button>
        <button onclick="clearHistory()" style="padding: 10px 15px; cursor: pointer; background-color: #dc3545; color: white; border: none; margin-left: 10px; border-radius: 4px;">🗑️ Clear All History</button>
        <button onclick="downloadMasterPDF()" style="padding: 10px 15px; cursor: pointer; background-color: #28a745; color: white; border: none; margin-left: 10px; border-radius: 4px;">📥 Download Master PDF</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Student ID / Name</th>
                <th>Submitted Time</th>
                <th>Answers (Preview)</th>
                <th>Total Violations</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="submissionTable">
            <tr><td colspan="5">Loading data...</td></tr>
        </tbody>
    </table>

<script>
    // ===============================================
    // 🛑 MASTER ANSWER KEY & QUESTION PAPER DATA
    // ===============================================
    const masterAnswerKey = {
        "q1": { question: "1. What is the primary objective of a Geographic Information System (GIS)?", correct: "Capturing, storing, analyzing, and managing spatial data" },
        "q2": { question: "2. Which of the following is NOT one of the five core components of GIS?", correct: "Atmosphere" },
        "q3": { question: "3. In which decade did the historical development of the first operational GIS (CGIS) begin?", correct: "1960s" },
        "q4": { question: "4. Which data format uses points, lines, and polygons to represent spatial features?", correct: "Vector Format" },
        "q5": { question: "5. What does spatial information refer to in GIS?", correct: "Data that has a specific location on Earth" },
        "q6": { question: "6. Which device is considered a GIS hardware input component?", correct: "Digitizer" },
        "q7": { question: "7. What is the fundamental building block of a raster data model?", correct: "Grid Cell or Pixel" },
        "q8": { question: "8. Non-spatial data associated with spatial features is known as:", correct: "Attribute Data" },
        "q9": { question: "9. Which software is an example of open-source GIS?", correct: "QGIS" },
        "q10": { question: "10. Who developed the first operational GIS, the Canada Geographic Information System?", correct: "Roger Tomlinson" },
        "q11": { question: "11. In a computer system used for GIS, what is the role of RAM?", correct: "Temporary workspace for active processing" },
        "q12": { question: "12. The mathematical rules that define how vector features share geometry are known as:", correct: "Topology" },
        "q13": { question: "13. Which GIS data format is most suitable for representing continuous data like elevation or temperature?", correct: "Raster" },
        "q14": { question: "14. Which part of the computer system executes GIS software instructions?", correct: "CPU" },
        "q15": { question: "15. What distinguishes a GIS from a standard drafting program (like traditional CAD)?", correct: "The linkage of spatial data with an attribute database" },
        "q16": { question: "16. The most critical 'People' component requirement for a successful GIS project is:", correct: "Trained GIS Professionals and Users" },
        "q17": { question: "17. A GPS receiver falls under which GIS component category?", correct: "Hardware" },
        "q18": { question: "18. Data regarding a city's population density stored in a table is an example of:", correct: "Attribute data" },
        "q19": { question: "19. In GIS terminology, what does DBMS stand for?", correct: "Database Management System" },
        "q20": { question: "20. What is a 'Shapefile' in GIS data formats?", correct: "A common vector data format developed by Esri" },
        "q21": { question: "21. The ________ component of GIS defines the organizational guidelines, rules, and procedures.", correct: "Methods/Procedures" },
        "q22": { question: "22. Features with distinct boundaries, such as buildings and land parcels, are best represented using the ________ data model.", correct: "Vector" },
        "q23": { question: "23. In vector format, a single coordinate pair (X,Y) represents a ________ feature.", correct: "Point" },
        "q24": { question: "24. The history of GIS traces its roots back to Dr. John Snow's spatial analysis of the 1854 ________ outbreak in London.", correct: "Cholera" },
        "q25": { question: "25. Data about data, which provides background information on a GIS dataset's source, date, and accuracy, is called ________.", correct: "Metadata" },
        "q26": { question: "26. In computer architecture required for GIS, the ________ acts as long-term storage for heavy spatial datasets.", correct: "Hard Disk / SSD" },
        "q27": { question: "27. Smaller pixel sizes in a raster dataset result in higher ________ resolution.", correct: "Spatial" },
        "q28": { question: "28. A network of roads is typically modeled in GIS as ________ features.", correct: "Line (or Polyline)" },
        "q29": { question: "29. The term ________ refers to the process of converting paper maps into digital vector data using a specialized board and puck.", correct: "Digitizing" },
        "q30": { question: "30. Esri's ArcGIS and QGIS are both primary examples of the ________ component of a GIS system.", correct: "Software" },
        "q31": { question: "31. GIS software only runs on supercomputers, making personal laptops inadequate for basic spatial analysis.", correct: "False" },
        "q32": { question: "32. The 'People' component of GIS includes administrators, developers, analysts, and general users.", correct: "True" },
        "q33": { question: "33. Raster formats are generally more storage-efficient than vector formats for representing simple boundaries like a state border.", correct: "False" },
        "q34": { question: "34. A standard computer mouse can be considered part of GIS hardware for digitizing and navigating spatial data.", correct: "True" },
        "q35": { question: "35. Spatial data tells us 'what' a feature is, while attribute data tells us 'where' it is located.", correct: "False" },
        "q36": { question: "36. CGIS (Canada Geographic Information System) was explicitly developed to handle large-scale land inventory tasks.", correct: "True" },
        "q37": { question: "37. Topology in GIS prevents data errors like overlapping polygons and unclosed lines.", correct: "True" },
        "q38": { question: "38. An aerial photograph or satellite image is fundamentally a vector data format.", correct: "False" },
        "q39": { question: "39. The history of modern computer-based GIS began prior to the invention of computers, relying entirely on manual map overlays on transparent paper.", correct: "False" },
        "q40": { question: "40. Data is generally considered the most expensive and time-consuming component to acquire in a GIS project.", correct: "True" }
    };

    let globalStudentData = []; 

    function loadData() {
        fetch('/api/all-submissions')
            .then(res => res.json())
            .then(data => {
                globalStudentData = data; 
                const tbody = document.getElementById('submissionTable');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">अभी तक किसी छात्र ने एग्जाम नहीं दिया है।</td></tr>';
                    return;
                }

                data.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    
                    let rawJSON = item.answers ? JSON.stringify(item.answers) : 'No Answers';
                    const answersPreview = rawJSON.length > 80 ? rawJSON.substring(0, 80) + '...' : rawJSON;
                    
                    let violationDetails = '';
                    if (item.violations && item.violations.length > 0) {
                        violationDetails = item.violations.map(v => `${v.type} (${v.time})`).join('<br>');
                    }

                    const violationBadge = item.violations.length > 0 
                        ? `<span class="violation-badge">${item.violations.length} Violations</span><br><span style="font-size: 11px; color: #d9534f; display:block; margin-top:5px;">${violationDetails}</span>` 
                        : `<span class="success-badge">Clean Exam</span>`;

                    tr.innerHTML = `
                        <td><strong>${item.studentName || 'Unknown'}</strong><br><small>${item.studentId || 'N/A'}</small></td>
                        <td>${new Date(item.submittedAt).toLocaleString()}</td>
                        <td><code>${answersPreview}</code></td>
                        <td>${violationBadge}</td>
                        <td style="display:flex; align-items:center;">
                            <button class="btn-pdf" onclick="downloadSinglePDF(${index})">📄 Get PDF</button>
                            <button class="btn-delete" onclick="deleteSingleRecord('${item._id}')">🗑️ Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error(err);
                alert('Data load करने में समस्या आई।');
            });
    }

    function deleteSingleRecord(recordId) {
        if (confirm("⚠️ क्या आप सच में इस छात्र का डेटा डिलीट करना चाहते हैं?")) {
            fetch(`/api/delete-submission/${recordId}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadData(); 
                } else {
                    alert("डेटा डिलीट करने में प्रॉब्लम आई।");
                }
            })
            .catch(err => {
                console.error("Delete error:", err);
                alert("Server error.");
            });
        }
    }

    function clearHistory() {
        if (confirm("⚠️ क्या आप सच में सारा पुराना डेटा डिलीट करना चाहते हैं? यह डेटा वापस नहीं मिलेगा!")) {
            fetch('/api/clear-submissions', { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("सारा पुराना डेटा डिलीट हो गया है! अब फ्रेश एग्जाम लिए जा सकते हैं।");
                    loadData(); 
                } else {
                    alert("डेटा डिलीट करने में प्रॉब्लम आई।");
                }
            })
            .catch(err => {
                console.error("Clear error:", err);
                alert("Server error.");
            });
        }
    }

    // ===============================================
    // PDF GENERATION SYSTEM (DYNAMIC AUTO-CHECKING)
    // ===============================================

    function formatAnswersForTable(answersObj) {
        if (!answersObj) answersObj = {}; 
        
        let formattedData = [];
        let score = 0;
        let totalQuestions = 0; 

        // Dono keys (Student Answers aur Master Key) ko mila kar ek unique list banayenge
        let allKeys = new Set([...Object.keys(answersObj), ...Object.keys(masterAnswerKey)]);
        
        // Sorting: Taaki q1, q2, q3 line se aayen
        let sortedKeys = Array.from(allKeys).sort((a, b) => {
            return (parseInt(a.match(/\d+/)) || 0) - (parseInt(b.match(/\d+/)) || 0);
        });

        for (let key of sortedKeys) {
            if (!key.startsWith('q')) continue;

            let studentAns = answersObj[key] ? answersObj[key] : "Not Attempted"; 
            let questionText = key.toUpperCase();
            let correctAns = "Manual Check";
            let status = "📝 Check";

            if (masterAnswerKey[key]) {
                questionText = masterAnswerKey[key].question;
                
                // MCQs jinke aage answer likha hai unhe count karenge
                if (masterAnswerKey[key].correct) {
                    correctAns = masterAnswerKey[key].correct;
                    totalQuestions++; // 🚀 Yahi Logic TOTAL MARKS ko apne aap set karta hai
                    
                    if (studentAns === "Not Attempted") {
                        status = "⚠️ Skipped";
                    } else if (studentAns.trim() === correctAns.trim()) {
                        status = "✅ Correct";
                        score++;
                    } else {
                        status = "❌ Wrong";
                    }
                } else {
                    correctAns = "Theory Question";
                }
            } else {
                // Agar HTML me question tha, par yahan Master key me bhool gaye
                questionText = `Question ${key.replace('q', '')} (Missing in Admin Key)`;
                status = "⚠️ Update Admin Key";
            }
            
            formattedData.push([questionText, studentAns, correctAns, status]);
        }
        
        return { table: formattedData, score: score, total: totalQuestions };
    }

    function downloadSinglePDF(index) {
        const student = globalStudentData[index];
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(18);
        doc.text("Student Examination Report", 14, 20);
        
        const resultData = formatAnswersForTable(student.answers);

        doc.setFontSize(12);
        doc.text(`Name: ${student.studentName || 'Unknown'}`, 14, 30);
        doc.text(`Batch / ID: ${student.studentId || 'N/A'}`, 14, 38);
        doc.text(`Submission Time: ${new Date(student.submittedAt).toLocaleString()}`, 14, 46);
        doc.text(`Violations: ${student.violations ? student.violations.length : 0}`, 14, 54);
        
        doc.setTextColor(40, 167, 69);
        doc.text(`Score (MCQs): ${resultData.score} / ${resultData.total}`, 120, 30);
        doc.setTextColor(0, 0, 0);
        
        doc.autoTable({
            startY: 60,
            head: [['Question', 'Student Answer', 'Correct Answer', 'Result']],
            body: resultData.table,
            theme: 'grid',
            headStyles: { fillColor: [0, 123, 255] },
            columnStyles: { 
                0: { cellWidth: 70 }, 
                1: { cellWidth: 40 }, 
                2: { cellWidth: 40 }, 
                3: { cellWidth: 25 }  
            }
        });
        
        doc.save(`${student.studentName || 'Student'}_Exam_Report.pdf`);
    }

    function downloadMasterPDF() {
        if (globalStudentData.length === 0) return alert("PDF बनाने के लिए कोई डेटा मौजूद नहीं है!");
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // PAGE 1: QUESTION PAPER & MASTER KEY
        doc.setFontSize(22);
        doc.setTextColor(0, 123, 255);
        doc.text("Master Question Paper & Answer Key", 14, 20);
        
        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        doc.text(`Date Generated: ${new Date().toLocaleString()}`, 14, 30);
        
        let masterTableData = [];
        for (let key in masterAnswerKey) {
            masterTableData.push([
                key.toUpperCase(),
                masterAnswerKey[key].question,
                masterAnswerKey[key].correct || "Manual Check (Theory)"
            ]);
        }
        
        doc.autoTable({
            startY: 40,
            head: [['Q. No', 'Question', 'Correct Answer']],
            body: masterTableData,
            theme: 'grid',
            headStyles: { fillColor: [52, 58, 64] },
            columnStyles: { 
                0: { cellWidth: 20 },
                1: { cellWidth: 100 },
                2: { cellWidth: 60 }
            }
        });

        // NEXT PAGES: STUDENTS EVALUATION DATA
        globalStudentData.forEach((student, i) => {
            doc.addPage(); 
            let currentY = 20;
            
            const resultData = formatAnswersForTable(student.answers);

            doc.setFontSize(16);
            doc.setTextColor(40, 167, 69); 
            doc.text(`Student: ${student.studentName || 'Unknown'} (Batch/ID: ${student.studentId || 'N/A'})`, 14, currentY);
            
            doc.setFontSize(11);
            doc.setTextColor(100, 100, 100);
            doc.text(`Submitted At: ${new Date(student.submittedAt).toLocaleString()}`, 14, currentY + 8);
            doc.text(`Violations Recorded: ${student.violations ? student.violations.length : 0}`, 14, currentY + 14);
            
            doc.setTextColor(0, 0, 0);
            doc.setFont(undefined, 'bold');
            doc.text(`MCQ Score: ${resultData.score} / ${resultData.total}`, 140, currentY + 14);
            doc.setFont(undefined, 'normal');
            
            doc.autoTable({
                startY: currentY + 20,
                head: [['Question', 'Student Answer', 'Correct Answer', 'Result']],
                body: resultData.table,
                theme: 'striped',
                headStyles: { fillColor: [52, 58, 64] },
                columnStyles: { 
                    0: { cellWidth: 70 },
                    1: { cellWidth: 40 },
                    2: { cellWidth: 40 },
                    3: { cellWidth: 25 }
                }
            });
        });
        
        doc.save("Master_Exam_Report_GIS.pdf");
    }

    loadData();
</script>

</body>
</html>
